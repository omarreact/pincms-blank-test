name: Verify blank PinCMS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm install --no-fund --no-audit
        env:
          DATABASE_URL: file:./dev.db
      - name: Run unit and source tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-not-a-real-secret-used-for-testing-only
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-not-a-real-secret-used-for-testing-only
